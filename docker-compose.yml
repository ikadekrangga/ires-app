services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: iresDB
      POSTGRES_USER: iresADMIN
      POSTGRES_PASSWORD: ires123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iresADMIN -d iresDB"]
      interval: 5s
      retries: 5
      timeout: 5s

  laravel_backend:
    build:
      context: ./laravel_backend
    container_name: laravel_backend
    command: php -S 0.0.0.0:9000 -t public
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - ./laravel_backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./laravel_backend/.env
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://localhost:9000') ? 0 : 1);",
        ]
      interval: 5s
      retries: 5
      timeout: 5s
      start_period: 20s

  python_app:
    build:
      context: ./python_scrapper
    container_name: python_app
    volumes:
      - ./python_scrapper:/app
    depends_on:
      laravel_backend:
        condition: service_healthy
    env_file:
      - ./python_scrapper/.env

  laravel_scheduler:
    build:
      context: ./laravel_backend
    container_name: laravel_scheduler
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./laravel_backend:/var/www
    env_file:
      - ./laravel_backend/.env

volumes:
  postgres_data:
